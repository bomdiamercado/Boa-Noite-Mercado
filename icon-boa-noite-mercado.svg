<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fundo -->
  <defs>
    <linearGradient id="nightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1419;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2332;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#nightGradient)"/>
  
  <!-- Estrelas de fundo -->
  <circle cx="40" cy="50" r="2" fill="#E9E6DE" opacity="0.6"/>
  <circle cx="210" cy="70" r="1.5" fill="#E9E6DE" opacity="0.5"/>
  <circle cx="220" cy="150" r="1" fill="#E9E6DE" opacity="0.4"/>
  <circle cx="50" cy="200" r="1.5" fill="#E9E6DE" opacity="0.5"/>
  <circle cx="180" cy="220" r="1" fill="#E9E6DE" opacity="0.4"/>
  
  <!-- Lua crescente (elemento central) -->
  <g transform="translate(128, 128)">
    <!-- Lua cheia (branca) -->
    <circle cx="0" cy="0" r="50" fill="#E9E6DE"/>
    
    <!-- Sombra (criando o crescente) -->
    <circle cx="20" cy="0" r="50" fill="#0F1419"/>
    
    <!-- Brilho/halo -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#D4A574" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Texto decorativo (opcional) -->
  <text x="128" y="225" font-family="Arial, sans-serif" font-size="14" fill="#D4A574" text-anchor="middle" opacity="0.8">
    BOA NOITE MERCADO
  </text>
</svg>
