<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fundo noturno (mais escuro que Bom Dia) -->
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1F2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F2A3A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#nightGrad)"/>
  
  <!-- Lua crescente centralizada (maior que no preview) -->
  <g transform="translate(256, 200)">
    <!-- Lua cheia (base branca) -->
    <circle cx="0" cy="0" r="90" fill="#E9E6DE"/>
    
    <!-- Sombra para criar o crescente -->
    <circle cx="45" cy="0" r="90" fill="#0A1F2E"/>
    
    <!-- Brilho/halo em âmbar -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#D4A574" stroke-width="3" opacity="0.8"/>
  </g>
  
  <!-- Texto "BOA NOITE" em branco -->
  <text x="256" y="380" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#E9E6DE" text-anchor="middle" letter-spacing="2">
    BOA NOITE
  </text>
  
  <!-- Texto "MERCADO" em âmbar -->
  <text x="256" y="470" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#D4A574" text-anchor="middle" letter-spacing="2">
    MERCADO
  </text>
</svg>
